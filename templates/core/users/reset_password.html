{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block page_title %}Reset Password – {{ target_user.username }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header">Set New Password for {{ target_user.username }}</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" minlength="8" required>
            <div class="form-text">Minimum 8 characters.</div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-warning">Set Password</button>
            <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
