services:
  - type: web
    name: wams
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn wams.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@wams.com
      - key: ADMIN_PASSWORD
        sync: false
